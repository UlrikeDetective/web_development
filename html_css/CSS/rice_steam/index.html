<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rice and steam - sleepy dumplings</title>
</head>
<body>
    <main class="scene">
        <input class="lid-toggle visually-hidden" type="checkbox" id="lid-toggle">
        <label class="steamer" for="lid-toggle">
            <span class="visually-hidden">Lift the steamer lid</span>
            <span class="table-shadow"></span>
            <span class="basket-rim"></span>
            <span class="basket-inner-wall"></span>
            <span class="basket-floor"></span>
            <span class="dumplings">
            <span class="dumpling dumpling-left">
                <span class="dumpling-body">
                <span class="face">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="blush blush-left"></span>
                    <span class="blush blush-right"></span>
                    <span class="mouth mouth-smile"></span>
                </span>
                </span>
            </span>
            <span class="dumpling dumpling-middle">
                <span class="dumpling-body">
                <span class="face">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="blush blush-left"></span>
                    <span class="blush blush-right"></span>
                    <span class="mouth mouth-grin"></span>
                </span>
                </span>
            </span>
            <span class="dumpling dumpling-right">
                <span class="dumpling-body">
                <span class="face">
                    <span class="eye eye-left"></span>
                    <span class="eye eye-right"></span>
                    <span class="blush blush-left"></span>
                    <span class="blush blush-right"></span>
                    <span class="mouth mouth-smile"></span>
                </span>
                </span>
            </span>
            </span>
            <span class="basket-front">
            <span class="basket-line basket-line-top"></span>
            <span class="basket-line basket-line-seam"></span>
            <span class="basket-line basket-line-bottom"></span>
            <span class="basket-overlap"></span>
            <span class="basket-tie"></span>
            </span>
            <span class="lid">
            <span class="lid-body">
                <span class="lid-side">
                <span class="lid-side-line"></span>
                </span>
                <span class="lid-top"></span>
            </span>
            </span>
            <span class="steam">
            <span class="puff puff-far-left"></span>
            <span class="puff puff-left"></span>
            <span class="puff puff-right"></span>
            <span class="puff puff-far-right"></span>
            </span>
            <span class="snore" aria-hidden="true">
            <span class="snore-letter">z</span>
            <span class="snore-letter">z</span>
            <span class="snore-letter">z</span>
            </span>
        </label>
        <h1 class="title">Rise &amp; Steam</h1>
        <p class="caption">
            <span class="caption-closed">Tap the lid to wake them up</span>
            <span class="caption-open">Tap again to tuck them back in</span>
        </p>
        </main>
    
</body>
</html>
